name: Live weekly model loop

on:
  push:
    branches: [main]
    # UI publication must never trigger the data/state/notification loop.
    paths-ignore:
      - 'published-site/**'
      - '.github/workflows/website.yml'
      - '.github/workflows/live-weekly.yml'
      - 'tests/test_readonly_website_workflow.py'
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        default: wed
        type: choice
        # wed-early: the one-time 2026-09-23 early Wednesday run (see the gate job)
        options: [deploy, wed, t90, tuesday, wed-early]
  # GitHub Actions evaluates cron in UTC and `on.schedule` has no timezone
  # field, so Eastern kickoffs are expressed twice: EDT months (Sep-Oct,
  # UTC-4) and EST months (Nov-Jan, UTC-5; DST ends 2026-11-01). The T-90
  # slots are placed ~60-80 minutes before every kickoff time on the 2026
  # slate (Wed/Fri/Sat games and 9:30 ET London kickoffs included);
  # tests/test_t90_schedule_contract.py replays these strings against the
  # real slate. The job itself only processes games in [T-90, T-0).
  schedule:
    # -- Wednesday model refresh (10:17 ET, as originally intended) --------
    - cron: "17 14 * 9,10 3"
    - cron: "17 15 * 11,12,1 3"
    # -- Tuesday grade + CLV + retrain (10:23 ET) --------------------------
    - cron: "23 14 * 9,10 2"
    - cron: "23 15 * 11,12,1 2"
    # -- T-90 refresh, EDT months ------------------------------------------
    - cron: "5 12 * 9,10 0"          # Sun 08:05 ET  (09:30 London)
    - cron: "55 15 * 9,10 0"         # Sun 11:55 ET  (13:00)
    - cron: "20 19 * 9,10 0"         # Sun 15:20 ET  (16:05 / 16:25)
    - cron: "15 23 * 9,10 0,1,3,4"   # Sun/Mon/Wed/Thu 19:15 ET (20:00-20:35)
    # -- T-90 refresh, EST months ------------------------------------------
    - cron: "5 13 * 11,12,1 0"       # Sun 08:05 ET  (09:30 London)
    - cron: "55 16 * 11,12,1 0,4,5"  # Sun/Thu/Fri 11:55 ET (13:00; Thanksgiving)
    - cron: "50 18 * 11,12,1 5"      # Fri 13:50 ET  (15:00 Black Friday)
    - cron: "20 20 * 11,12,1 0,4,5"  # Sun/Thu/Fri 15:20 ET (16:05 / 16:25 / 16:30)
    - cron: "50 20 * 11,12,1 6"      # Sat 15:50 ET  (17:00)
    - cron: "15 0 * 11,12,1 *"       # every day 19:15 ET previous evening (night games)
    # -- ONE-TIME early Wednesday run, 2026-09-23 only ------------------------
    # Owner request: the Week-3 fresh run inside 05:00-07:00 ET (09:00-11:00Z).
    # Scheduled runs here have started 2-4 h after their cron time, so these are
    # BACKUP triggers spread across the night; the primary trigger is a
    # workflow_dispatch job=wed-early at ~09:03Z. The gate job accepts only
    # 09:00-10:25Z (sleeping from 08:10Z to 09:00Z if early), and at most ONE run
    # claims the day via the atomic tag early-wed-2026-09-23. Any other date: skip.
    - cron: "5 5 23 9 *"
    - cron: "35 5 23 9 *"
    - cron: "5 6 23 9 *"
    - cron: "35 6 23 9 *"
    - cron: "5 7 23 9 *"
    - cron: "35 7 23 9 *"
    - cron: "5 8 23 9 *"
    - cron: "35 8 23 9 *"
    - cron: "5 9 23 9 *"
    - cron: "35 9 23 9 *"

permissions:
  contents: write
  pages: write
  id-token: write

# The release pointer and model database are a single production state.  No
# two scheduled/manual invocations may restore the same state and race to save.
concurrency:
  group: nfl-live-production
  cancel-in-progress: false

jobs:
  # Decides the job before any state, feed or odds work.  Normal events map exactly as
  # before.  The one-time early Wednesday run (2026-09-23) is admitted only inside
  # 09:00-10:25Z and only by the run that atomically creates tag early-wed-2026-09-23;
  # once that tag exists, the regular Wednesday schedule on 2026-09-23 is skipped so the
  # day's odds acquisition and publication happen once.  If no early run ever claimed
  # the day, the regular Wednesday run proceeds as usual.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      job: ${{ steps.g.outputs.job }}
    steps:
      - id: g
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          INPUT_JOB: ${{ github.event.inputs.job }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CLAIM="early-wed-2026-09-23"; DAY="2026-09-23"
          claimed() { gh api "repos/$REPO/git/ref/tags/$CLAIM" >/dev/null 2>&1; }
          if [[ "$EVENT" == "push" ]]; then job=deploy
          elif [[ "$EVENT" == "workflow_dispatch" ]]; then job="$INPUT_JOB"
          elif [[ "$SCHED" == *" 23 9 *" ]]; then job=wed-early
          elif [[ "$SCHED" == "23 14 * 9,10 2" || "$SCHED" == "23 15 * 11,12,1 2" ]]; then job=tuesday
          elif [[ "$SCHED" == "17 14 * 9,10 3" || "$SCHED" == "17 15 * 11,12,1 3" ]]; then job=wed
          else job=t90; fi
          if [[ "$job" == "wed-early" ]]; then
            start=$(date -u -d "${DAY}T09:00:00Z" +%s); last=$(date -u -d "${DAY}T10:25:00Z" +%s)
            now=$(date -u +%s)
            if [[ "$(date -u +%F)" != "$DAY" ]]; then echo "early run is for $DAY only"; job=skip
            elif (( now < start - 3000 )); then echo "fired before 08:10Z; not waiting"; job=skip
            elif claimed; then echo "the day is already claimed"; job=skip
            else
              if (( now < start )); then echo "waiting $(( start - now ))s for 09:00Z"; sleep $(( start - now )); fi
              if (( $(date -u +%s) >= last )); then echo "past 10:25Z; not starting"; job=skip
              elif gh api -X POST "repos/$REPO/git/refs" -f ref="refs/tags/$CLAIM" -f sha="$SHA" >/dev/null; then
                echo "claimed $CLAIM at $(date -u +%FT%TZ)"; job=wed
              else echo "claim lost to another run"; job=skip; fi
            fi
          elif [[ "$job" == "wed" && "$EVENT" == "schedule" && "$(date -u +%F)" == "$DAY" ]] && claimed; then
            echo "early Wednesday run already claimed $DAY; regular run skipped (no duplicate odds/publication)"
            job=skip
          fi
          echo "job=$job" | tee -a "$GITHUB_OUTPUT"

  run:
    needs: gate
    if: needs.gate.outputs.job != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      STATE_TAG: model-state
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest

      # This cache is only a rebuildable input optimization.  Mutable model
      # state is restored from a checksummed release asset below.
      - name: Cache immutable historical inputs
        uses: actions/cache@v5
        with:
          path: |
            historical/historical_pbp.parquet
            historical_lines.parquet
          key: historical-v2-2019-2023-${{ hashFiles('requirements.txt', 'scripts/bootstrap_history.py', 'nflvalue/features.py', 'nflvalue/advanced_features.py') }}

      # Current-season feeds are also rebuildable.  A rolling cache avoids a
      # full refetch every run, but eviction is harmless because ingest can
      # recreate every file in this list.
      - name: Restore rebuildable seasonal feeds
        uses: actions/cache/restore@v5
        with:
          path: |
            historical/pbp_*.parquet
            historical/lines_extra.parquet
            historical/rosters_weekly.parquet
            historical/injuries.parquet
            historical/players_meta.parquet
          key: seasonal-feeds-${{ github.run_id }}
          restore-keys: seasonal-feeds-

      - name: Validate or rebuild frozen history
        run: python scripts/bootstrap_history.py

      - name: Restore checksummed production state
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/state-download"
          if gh release view "$STATE_TAG" --json body --jq .body > "$RUNNER_TEMP/state-latest.json" 2>/dev/null; then
            asset="$(jq -er .asset "$RUNNER_TEMP/state-latest.json")"
            sha="$(jq -er .sha256 "$RUNNER_TEMP/state-latest.json")"
            if [[ ! "$asset" =~ ^state-[0-9]+-[0-9]+\.tar\.gz$ ]] || [[ ! "$sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid model-state release pointer" >&2
              exit 1
            fi
            gh release download "$STATE_TAG" --pattern "$asset" --dir "$RUNNER_TEMP/state-download"
            python scripts/state_store.py restore --archive "$RUNNER_TEMP/state-download/$asset" --sha "$sha"
          else
            echo "No prior production state; this is a cold start"
          fi

      - name: Select scheduled job
        id: select
        shell: bash
        # decided once, before any state/feed/odds work, by the gate job
        run: echo "job=${{ needs.gate.outputs.job }}" >> "$GITHUB_OUTPUT"

      - name: Run weekly job
        run: python scripts/auto_weekly.py --job "${{ steps.select.outputs.job }}"

      # No `always()`: a failed/partial run must never become the next state.
      # The versioned archive is uploaded first and the release body is changed
      # last, so a failed upload leaves the previous pointer restorable.
      - name: Publish successful production state
        shell: bash
        run: |
          asset="state-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          python scripts/state_store.py pack --archive "$archive"
          if ! gh release view "$STATE_TAG" >/dev/null 2>&1; then
            gh release create "$STATE_TAG" --prerelease --title "Model state (automation)" --notes "{}"
          fi
          gh release upload "$STATE_TAG" "$archive"
          python scripts/state_store.py pointer --archive "$archive" --asset "$asset" --output "$RUNNER_TEMP/state-latest.json"
          gh release edit "$STATE_TAG" --notes-file "$RUNNER_TEMP/state-latest.json"

      # Every job that fetches feeds must persist them: a Wednesday or T-90
      # refetch that is thrown away is refetched from scratch next run.  A
      # deploy-only run fetches nothing, so saving there would replace a
      # populated cache with an empty one.  No `always()`: this step inherits
      # step-level success-only semantics, so a half-finished ingest can never
      # become the cache the next run restores.
      - name: Save rebuildable seasonal feeds
        if: contains(fromJSON('["wed","t90","tuesday"]'), steps.select.outputs.job)
        uses: actions/cache/save@v5
        with:
          path: |
            historical/pbp_*.parquet
            historical/lines_extra.parquet
            historical/rosters_weekly.parquet
            historical/injuries.parquet
            historical/players_meta.parquet
          key: seasonal-feeds-${{ github.run_id }}

      - name: Keep the eight newest state archives
        shell: bash
        run: |
          gh release view "$STATE_TAG" --json assets --jq '.assets | sort_by(.createdAt) | reverse | map(select(.name | test("^state-[0-9]+-[0-9]+\\.tar\\.gz$"))) | .[8:] | .[].name' |
          while read -r old_asset; do
            [[ -z "$old_asset" ]] || gh release delete-asset "$STATE_TAG" "$old_asset" --yes
          done

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: model-run-${{ steps.select.outputs.job }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 30
          # Deliberately enumerated, never a bare `.`: evidence artifacts are
          # downloadable by anyone with repo read access, and config.local.json
          # (webhooks, API keys) lives at the repository root.
          path: |
            reports/
            drops/*.html
            dashboard.html
            data/*.json

      # The public site for the current week, built from THIS run's database.
      # Only wed/t90 runs produce one, and only after the production state was
      # saved above (success-only step semantics). Exit 3 = nothing stored for
      # the current week -> no artifact, the live site stays as it is; any
      # other non-zero fails the run, and website.yml (the single Pages
      # deployer) publishes only artifacts from successful runs.
      - name: Build public site from this run
        id: site
        if: contains(fromJSON('["wed","t90"]'), steps.select.outputs.job)
        shell: bash
        run: |
          set +e
          python scripts/build_public_site.py --current --db data/nfl_props.db \
            --archive published-site --out "$RUNNER_TEMP/public-site" --label fresh
          rc=$?
          set -e
          if [[ $rc -eq 0 ]]; then echo "built=true" >> "$GITHUB_OUTPUT"
          elif [[ $rc -eq 3 ]]; then echo "built=false" >> "$GITHUB_OUTPUT"
          else exit "$rc"; fi
      - name: Upload public site for the website publisher
        if: steps.site.outputs.built == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: public-site
          path: ${{ runner.temp }}/public-site
          if-no-files-found: error
          retention-days: 30

      # Everything the published site contains is assembled by one script so
      # it can be built and asserted on offline (tests/test_pages_workflow_
      # contract.py): the dashboard as index.html, the slim hub feed for
      # dearing-wedding.com, and this week's drop at both a stable
      # reports/latest.html and a permanent reports/{season}/week-{n}.html.
      # The season and week come from the generated payload, so a missing or
      # stale document degrades to a visible notice instead of republishing a
      # previous week.
      - name: Prepare dashboard for GitHub Pages
        run: python scripts/prepare_pages.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy-dashboard:
    # The website workflow publishes the reviewed reading artifact independently.
    # Keep model run evidence, but never overwrite that site with a failed-run
    # notice or the old committed demonstration dashboard.
    if: ${{ false }}
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
