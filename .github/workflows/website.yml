name: Publish football website

on:
  push:
    branches: [main]
    paths:
      - 'published-site/**'
      - '.github/workflows/website.yml'
  # A successful wed/t90 production run uploads a `public-site` artifact built
  # by scripts/build_public_site.py; this workflow is still the ONLY Pages
  # deployer (live-weekly's deploy job stays disabled).
  workflow_run:
    workflows: ["Live weekly model loop"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: football-website-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - id: pages
        uses: actions/configure-pages@v5
      # Candidate: the run's generated artifact (workflow_run) or the committed
      # seed (push/dispatch). Never replace a newer live publication with an
      # older one, so a stale seed push cannot overwrite a production week.
      - name: Select the publication candidate
        id: pick
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          LIVE: ${{ steps.pages.outputs.base_url }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            if ! gh run download "$RUN_ID" --repo "${{ github.repository }}" -n public-site -D "$RUNNER_TEMP/candidate"; then
              echo "Run $RUN_ID produced no public-site artifact; live site unchanged"
              echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            rm -rf published-site && mv "$RUNNER_TEMP/candidate" published-site
          fi
          curl -fsS "${LIVE%/}/publication.json" -o "$RUNNER_TEMP/live.json" || echo '{}' > "$RUNNER_TEMP/live.json"
          python3 - "$RUNNER_TEMP/live.json" <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, sys
          def t(x):
              try:
                  v = dt.datetime.fromisoformat(str(x).replace('Z', '+00:00'))
                  return v if v.tzinfo else v.replace(tzinfo=dt.timezone.utc)
              except ValueError:
                  return None
          try:
              live = t(json.load(open(sys.argv[1])).get('published_at'))
          except Exception:
              live = None
          cand = t(json.load(open('published-site/publication.json')).get('published_at'))
          ok = cand is not None and (live is None or cand > live)
          print(f"publish={'true' if ok else 'false'}")
          print(f"candidate {cand} vs live {live}: {'publish' if ok else 'keep live'}", file=sys.stderr)
          PY
      - name: Check the public artifact
        if: steps.pick.outputs.publish == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path, PurePosixPath
          root = Path('published-site')
          assert root.is_dir() and not root.is_symlink(), 'published-site must be an existing real directory'
          manifest_path = root / 'publication.json'
          assert manifest_path.is_file() and not manifest_path.is_symlink(), 'publication.json must be a regular file'
          for candidate in root.rglob('*'):
              assert not candidate.is_symlink(), f'Symlinks are not allowed: {candidate}'

          fixed_public_files = {
              'index.html', 'best-bets.html', 'history.html', 'dashboard.html', 'history.json', 'README.txt',
              'api/hub.json', 'reports/index.json', 'reports/latest.html', 'games/pages.json', 'games/index.json',
          }
          report_week = re.compile(r'reports/[0-9]{4}/week-(?:[1-9]|1[0-9]|2[0-2])\.html\Z')
          game_page = re.compile(r'games/[0-9]{4}_[0-9]{2}_[A-Za-z]{2,3}_[A-Za-z]{2,3}\.html\Z')
          static_asset = re.compile(r'assets/(?:[^/]+/)*[^/]+\.(?:css|js|svg|png|ico)\Z')

          def is_canonical_public_file(name):
              assert isinstance(name, str), 'Manifest file names must be strings'
              relative = PurePosixPath(name)
              assert relative.as_posix() == name and not relative.is_absolute(), f'Non-canonical path: {name}'
              assert '.' not in relative.parts and '..' not in relative.parts, f'Path traversal: {name}'
              assert relative.parts, f'Empty path: {name}'
              assert (
                  name in fixed_public_files
                  or report_week.fullmatch(name)
                  or game_page.fullmatch(name)
                  or static_asset.fullmatch(name)
              ), f'Unexpected public file: {name}'
              return relative

          manifest = json.loads(manifest_path.read_text())
          assert manifest['kind'] == 'saved-model-analysis'
          assert manifest['approved_bets'] == 0
          assert manifest['files'], 'Empty publication manifest'
          for required in ('index.html', 'best-bets.html', 'history.html', 'api/hub.json'):
              assert required in manifest['files']
          for name, digest in manifest['files'].items():
              relative = is_canonical_public_file(name)
              path = root.joinpath(*relative.parts)
              assert path.resolve().is_relative_to(root.resolve())
              assert path.is_file(), f'Manifest entry is not a regular file: {name}'
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
          actual = {str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          assert actual == set(manifest['files']) | {'publication.json'}
          print('Verified static football reading artifact; source dates retained.')
          PY
      - uses: actions/upload-pages-artifact@v4
        if: steps.pick.outputs.publish == 'true'
        with:
          path: published-site
      - name: Publish the reading experience
        if: steps.pick.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
