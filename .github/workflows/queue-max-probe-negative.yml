# NEGATIVE CONTROL: GitHub documents queue: max + cancel-in-progress: true as a validation error.
# block used by live-weekly.yml / publication-ingest.yml (cancel-in-progress: true +
# queue: max). Own group, no secrets, no permissions, no checkout, no state/odds/site work.
# Runs only on pushes to this probe branch.
name: queue-max probe NEGATIVE CONTROL (expected validation error)

on:
  push:
    branches: [probe/queue-max-nonproduction-20260924]
    paths: ['.github/workflows/queue-max-probe*.yml']

permissions: {}

concurrency:
  group: queue-max-probe-negative-control
  cancel-in-progress: true
  queue: max

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "workflow accepted with concurrency queue=max, cancel-in-progress=false"
